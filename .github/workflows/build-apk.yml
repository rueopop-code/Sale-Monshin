name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'icon-*.png'
      - 'ic_launcher_*.png'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Init npm and install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/cli

      - name: Create capacitor.config.json
        run: |
          cat > capacitor.config.json << 'CAPEOF'
          {
            "appId": "com.monshin.sales",
            "appName": "Monshin Sales",
            "webDir": "www",
            "server": {
              "url": "https://rueopop-code.github.io/Sale-Monshin/",
              "cleartext": false
            }
          }
          CAPEOF

      - name: Build web assets
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true

      - name: Add Android platform
        run: npx cap add android

      - name: Capacitor sync
        run: npx cap sync android

      - name: Set app icon
        run: |
          # ลบ adaptive icon XML ที่ทับ icon ปกติ
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -f android/app/src/main/res/drawable/ic_launcher_background.xml
          rm -f android/app/src/main/res/drawable/ic_launcher_foreground.xml

          # copy icon ทุก resolution
          cp icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          cp ic_launcher_xxhdpi.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp ic_launcher_xxhdpi.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp ic_launcher_xhdpi.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp ic_launcher_xhdpi.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp ic_launcher_hdpi.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp ic_launcher_hdpi.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp ic_launcher_mdpi.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp ic_launcher_mdpi.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          
          # copy สำหรับ foreground ด้วย (Android 8+)
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png 2>/dev/null || true

          # แก้ splash screen
          mkdir -p android/app/src/main/res/drawable
          cp icon-512.png android/app/src/main/res/drawable/splash.png 2>/dev/null || true
          cp icon-512.png android/app/src/main/res/drawable-land-hdpi/splash.png 2>/dev/null || true
          cp icon-512.png android/app/src/main/res/drawable-land-mdpi/splash.png 2>/dev/null || true
          cp icon-512.png android/app/src/main/res/drawable-land-xhdpi/splash.png 2>/dev/null || true
          cp icon-512.png android/app/src/main/res/drawable-land-xxhdpi/splash.png 2>/dev/null || true
          cp icon-512.png android/app/src/main/res/drawable-land-xxxhdpi/splash.png 2>/dev/null || true
          cp icon-512.png android/app/src/main/res/drawable-port-hdpi/splash.png 2>/dev/null || true
          cp icon-512.png android/app/src/main/res/drawable-port-mdpi/splash.png 2>/dev/null || true
          cp icon-512.png android/app/src/main/res/drawable-port-xhdpi/splash.png 2>/dev/null || true
          cp icon-512.png android/app/src/main/res/drawable-port-xxhdpi/splash.png 2>/dev/null || true
          cp icon-512.png android/app/src/main/res/drawable-port-xxxhdpi/splash.png 2>/dev/null || true

          # แก้ splash background เป็นสีแดงมนชิน
          find android/app/src/main/res -name "launch_background.xml" | xargs -I{} sed -i 's/#ffffff/#C0392B/g; s/#FFFFFF/#C0392B/g' {} 2>/dev/null || true

      - name: Add GPS Background Service
        run: |
          mkdir -p android/app/src/main/java/com/monshin/sales
          cat > android/app/src/main/java/com/monshin/sales/LocationService.java << 'JAVAEOF'
          package com.monshin.sales;
          import android.app.*;
          import android.content.*;
          import android.location.*;
          import android.os.*;
          import android.util.Log;
          import androidx.core.app.NotificationCompat;
          import java.net.*;
          import java.io.*;
          public class LocationService extends Service {
            private static final String CHANNEL_ID = "monshin_gps";
            private static final int NOTIF_ID = 1001;
            private static final String SB_URL = "https://ckfzscprxighfxztmgct.supabase.co";
            private static final String SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrZnpzY3ByeGlnaGZ4enRtZ2N0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTU0NDIsImV4cCI6MjA5MjYzMTQ0Mn0.nQ_LhPz9GsehqRSNx67G5cqxCKHD-cM1gbs2edTqUpw";
            private LocationManager lm;
            private String salesId = "";
            private LocationListener listener;
            @Override public void onCreate() {
              super.onCreate();
              createNotificationChannel();
              startForeground(NOTIF_ID, buildNotification());
              lm = (LocationManager) getSystemService(LOCATION_SERVICE);
            }
            @Override public int onStartCommand(Intent intent, int flags, int startId) {
              if (intent != null && intent.hasExtra("salesId")) salesId = intent.getStringExtra("salesId");
              startTracking();
              return START_STICKY;
            }
            private void startTracking() {
              listener = loc -> sendLocation(loc.getLatitude(), loc.getLongitude());
              try {
                if (lm.isProviderEnabled(LocationManager.GPS_PROVIDER))
                  lm.requestLocationUpdates(LocationManager.GPS_PROVIDER, 30000, 10, listener);
                if (lm.isProviderEnabled(LocationManager.NETWORK_PROVIDER))
                  lm.requestLocationUpdates(LocationManager.NETWORK_PROVIDER, 30000, 10, listener);
              } catch (SecurityException e) { Log.e("GPS", "No permission", e); }
            }
            private void sendLocation(double lat, double lng) {
              new Thread(() -> { try {
                URL url = new URL(SB_URL + "/rest/v1/sales_locations");
                HttpURLConnection c = (HttpURLConnection) url.openConnection();
                c.setRequestMethod("POST");
                c.setRequestProperty("apikey", SB_KEY);
                c.setRequestProperty("Authorization", "Bearer " + SB_KEY);
                c.setRequestProperty("Content-Type", "application/json");
                c.setRequestProperty("Prefer", "resolution=merge-duplicates");
                c.setDoOutput(true);
                String body = "{\"sales_id\":\""+salesId+"\",\"lat\":"+lat+",\"lng\":"+lng+",\"updated_at\":\""+java.time.Instant.now().toString()+"\"}";
                c.getOutputStream().write(body.getBytes());
                c.getResponseCode();
                c.disconnect();
              } catch (Exception e) { Log.e("GPS", "Send failed", e); }}).start();
            }
            private Notification buildNotification() {
              return new NotificationCompat.Builder(this, CHANNEL_ID)
                .setContentTitle("มนชิน ซัพพลาย")
                .setContentText("กำลังติดตามตำแหน่ง GPS")
                .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                .setPriority(NotificationCompat.PRIORITY_LOW)
                .setOngoing(true)
                .build();
            }
            private void createNotificationChannel() {
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                NotificationChannel ch = new NotificationChannel(CHANNEL_ID, "GPS Tracking", NotificationManager.IMPORTANCE_LOW);
                ((NotificationManager)getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(ch);
              }
            }
            @Override public void onDestroy() {
              if (lm != null && listener != null) lm.removeUpdates(listener);
              super.onDestroy();
            }
            @Override public IBinder onBind(Intent i) { return null; }
          }
          JAVAEOF
          sed -i 's|</application>|    <service android:name=".LocationService" android:foregroundServiceType="location" android:exported="false" />\n    </application>|' android/app/src/main/AndroidManifest.xml

      - name: Override MainActivity for GPS Bridge
        run: |
          cat > android/app/src/main/java/com/monshin/sales/MainActivity.java << 'MAINEOF'
          package com.monshin.sales;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getBridge().getWebView().setWebViewClient(new WebViewClient() {
                @Override
                public boolean shouldOverrideUrlLoading(WebView view, android.webkit.WebResourceRequest request) {
                  Uri uri = request.getUrl();
                  if (uri != null && "monshin".equals(uri.getScheme())) {
                    String host = uri.getHost();
                    if ("startgps".equals(host)) {
                      String salesId = uri.getQueryParameter("salesId");
                      Intent intent = new Intent(MainActivity.this, LocationService.class);
                      if (salesId != null) intent.putExtra("salesId", salesId);
                      if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {
                        startForegroundService(intent);
                      } else {
                        startService(intent);
                      }
                    } else if ("stopgps".equals(host)) {
                      stopService(new Intent(MainActivity.this, LocationService.class));
                    }
                    return true;
                  }
                  return false;
                }
              });
            }
          }
          MAINEOF

      - name: Add permissions to AndroidManifest
        run: |
          sed -i 's/<\/manifest>/    <uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" \/>\n    <uses-permission android:name="android.permission.CAMERA" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" \/>\n    <uses-permission android:name="android.permission.VIBRATE" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" \/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n<\/manifest>/' android/app/src/main/AndroidManifest.xml

      - name: Fix Kotlin duplicate
        run: |
          cat >> android/app/build.gradle << 'GRADLEEOF'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.0'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.0'
              }
          }
          GRADLEEOF

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: monshin-sales-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
